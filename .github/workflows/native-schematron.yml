name: native-schematron

on:
  push:
    paths:
      - ".github/**"
      - "VERSION"
      - "java/**"
      - "javascript/**"
      - "r/**"
      - "rust/**"
      - "go/**"
      - "python/**"
      - "conformance/**"
      - "scripts/**"
      - "tools/**"
      - "validation/rules/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/**"
      - "VERSION"
      - "java/**"
      - "javascript/**"
      - "r/**"
      - "rust/**"
      - "go/**"
      - "python/**"
      - "conformance/**"
      - "scripts/**"
      - "tools/**"
      - "validation/rules/**"
      - "tests/**"

jobs:
  rules-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv run --project tools python tools/verify_rules.py
      - run: uv run --project tools pytest -q tools/test_rules_sync.py

  cross-runtime-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - run: ./scripts/test-all.sh

  package-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
      - run: npm ci --prefix javascript
      - run: ./scripts/test-packaged-rules.sh

  r-platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - name: Check package
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning")
