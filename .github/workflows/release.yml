name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-gate:
    name: Full conformance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          components: rustfmt
      - uses: astral-sh/setup-uv@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
      - name: Verify coordinated version
        run: ./scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - name: Run full suite
        run: ./scripts/test-all.sh

  package-integrity:
    name: Packaged rules and legacy compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - uses: astral-sh/setup-uv@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
      - run: npm ci --prefix javascript
      - run: ./scripts/test-packaged-rules.sh

  source-archives:
    name: Tagged source archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: ./scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - run: ./scripts/package-sources.sh dist "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: source-archives
          path: dist/*
          if-no-files-found: error

  java-jar:
    name: Java JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -f java/pom.xml test package
      - uses: actions/upload-artifact@v4
        with:
          name: java-jar
          path: java/target/sbgn-validator-*.jar
          if-no-files-found: error

  python-packages:
    name: Python wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build python --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error

  javascript-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci --prefix javascript
      - run: mkdir -p dist && (cd javascript && npm pack --pack-destination ../dist)
      - uses: actions/upload-artifact@v4
        with:
          name: javascript-package
          path: dist/*.tgz
          if-no-files-found: error

  r-source-package:
    name: Checked R source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Build and check package
        run: |
          R CMD build r
          R CMD check --no-manual sbgnvalidator_*.tar.gz
      - run: mkdir -p dist && mv sbgnvalidator_*.tar.gz dist/
      - uses: actions/upload-artifact@v4
        with:
          name: r-source-package
          path: dist/*.tar.gz
          if-no-files-found: error

  go-binaries:
    name: Go binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: make -C go test release
      - uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: go/dist/sbgn-validator-*
          if-no-files-found: error

  rust-linux:
    name: Rust Linux musl (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: ./scripts/build-rust-musl.sh
      - run: |
          mkdir -p dist
          cp rust/target/x86_64-unknown-linux-musl/release/sbgn-validator \
            dist/sbgn-validator-rust-linux-amd64-musl
          file dist/sbgn-validator-rust-linux-amd64-musl | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/upload-artifact@v4
        with:
          name: rust-linux-amd64
          path: dist/*
          if-no-files-found: error

  rust-macos:
    name: Rust macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          targets: aarch64-apple-darwin
      - run: cargo build --manifest-path rust/Cargo.toml --release --target aarch64-apple-darwin --bin sbgn-validator
      - run: |
          mkdir -p dist
          cp rust/target/aarch64-apple-darwin/release/sbgn-validator \
            dist/sbgn-validator-rust-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: rust-macos-arm64
          path: dist/*
          if-no-files-found: error

  rust-windows:
    name: Rust Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
          targets: x86_64-pc-windows-msvc
      - run: cargo build --manifest-path rust/Cargo.toml --release --target x86_64-pc-windows-msvc --bin sbgn-validator
      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item rust/target/x86_64-pc-windows-msvc/release/sbgn-validator.exe dist/sbgn-validator-rust-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: rust-windows-amd64
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - release-gate
      - package-integrity
      - source-archives
      - java-jar
      - python-packages
      - javascript-package
      - r-source-package
      - go-binaries
      - rust-linux
      - rust-macos
      - rust-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          body: |
            Coordinated SBGN Validator release for Java, JavaScript, R, Rust,
            Go, and Python. Every artifact carries the same embedded libSBGN
            Schematron ruleset; see `SHA256SUMS.txt` for artifact checksums.
          append_body: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
