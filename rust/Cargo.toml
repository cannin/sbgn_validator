[package]
name = "sbgn-validator"
version = "0.1.1"
edition = "2024"
include = [
    "src/**",
    "vendor/schematron/src/**",
    "vendor/schematron/Cargo.toml.orig",
    "vendor/schematron/README.libsbgn.md",
    "Cargo.toml",
    "Cargo.lock",
]
description = "Native SBGN Schematron validator with packaged libSBGN rules"
license = "MIT"

[dependencies]
quick-xml = "0.37.5"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2"

[features]
default = ["serde"]
serde = []
